# Diesen Eintrag in scripts.yaml ergänzen und die HA-Skripte neu laden.
# In der Skript-Anbindung einer Liste auswählen; keine Bestände werden geändert.
ha_list_manager_ereignisse_testen:
  alias: "HA-LM – Ereignisse testen"
  description: "Zeigt die zuletzt übergebene Listenaktion als HA-Benachrichtigung."
  icon: mdi:message-badge-outline
  mode: queued
  max: 100
  sequence:
    - action: persistent_notification.create
      data:
        notification_id: ha_list_manager_ereignisse_testen
        title: "HA List Manager – {{ list_name | default('Skript-Test', true) }}"
        message: |-
          {{ message | default('Der Benachrichtigungstest funktioniert. Für echte Artikeldaten das Skript einer Liste zuordnen und dort ein ausgewähltes Ereignis auslösen.', true) }}

          **Zeit:** {{ now().strftime('%d.%m.%Y %H:%M:%S') }}
          {% if event is defined %}
          **Ereignis:** {{ event }}
          **Artikel:** {{ name | default('–', true) }}
          **Menge:** {{ quantity | default('–') }}
          **Quelle:** {{ source | default('–', true) }}
          {% if stock_before is defined and stock_before != '' %}
          **Bestand:** {{ stock_before }} → {{ stock_after }}
          {% endif %}
          {% endif %}
